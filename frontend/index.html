<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas AI — Aerial Disaster Spatial Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Sans alternate: Plus Jakarta Sans + Satoshi -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Baserona';
        src: url('/fonts/Baserona.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background-color: #07090E;
        color: #F1F5F9;
        font-family: 'Plus Jakarta Sans', 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow-x: hidden;
      }
      .font-heading {
        font-family: 'Baserona', sans-serif;
        letter-spacing: 0.05em;
      }
      .font-subtext {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        letter-spacing: 0.01em;
        text-transform: none;
      }
      code, pre {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Custom subtle scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.2);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.4);
      }
    </style>
  </head>
  <body class="bg-[#07090E] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
